name: PR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Sözleşme kapıları — kod derlenmeden önce çalışır. Registry veya doküman
  # bozuksa TypeScript/Java işlerini çalıştırmanın anlamı yok.
  # -------------------------------------------------------------------------
  contracts:
    name: Contracts and documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version from compatibility profile
        id: profile
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          echo "Pinned Node: ${node_version}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # DOC-GATE-03 — JSON/YAML parse (markdown içindeki bloklar dahil)
      - name: DOC-GATE-03 parse
        run: pnpm run check:parse

      # DOC-GATE-04 — registry bütünlüğü, duplicate, risk türetimi, ADR-0007
      - name: DOC-GATE-04 registry
        run: pnpm run check:registry

      # Şema derlenebilirliği ve kayıtların şemaya uygunluğu
      - name: Schema validation
        run: pnpm run check:schemas

      # DOC-GATE-01/02/03/05/06 — boyut, belirsizlik, link, izlenebilirlik,
      # güvenlik dürüstlüğü
      - name: Documentation gates
        run: pnpm run check:docs

      # Generated dosyalar elle düzenlenmiş mi?
      - name: Contract generation drift
        run: pnpm run gen:check

  typescript:
    name: TypeScript
    runs-on: ${{ matrix.os }}
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated tipler olmadan typecheck geçemez
      - run: pnpm run gen

      - run: pnpm run typecheck

      - run: pnpm run test

  java:
    name: Paper Bridge
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Java major
        id: profile
        run: |
          java_major="$(grep -A2 '^java:' compatibility/paper-26.2-build-84-v1.yaml | grep 'runtime_major:' | head -1 | sed 's/.*runtime_major: *\([0-9]*\).*/\1/')"
          echo "java=${java_major}" >> "$GITHUB_OUTPUT"
          echo "Pinned Java: ${java_major}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen

      # Wrapper doğrulaması — kendi ürünümüzün supply-chain kuralı kendimize de
      # uygulanır (docs/security/supply-chain.md).
      - uses: gradle/actions/wrapper-validation@v4

      # DİKKAT: Gradle cache'i BİLİNÇLİ olarak önbelleğe alınmaz.
      #
      # Runner her koşuda boş bir cache ile başlar. Bu, sıcak cache ile üretilmiş
      # eksik verification-metadata.xml'i yakalayan TEK güvenilir korumadır;
      # ölçüldü ve bir kez gerçekten yakalandı (supply-chain.md).
      # Cache eklemek build'i hızlandırır fakat bu hata sınıfını görünmez kılar.
      - name: Build bridge (soğuk cache — kasıtlı)
        working-directory: bridge/paper
        run: ./gradlew --no-daemon build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # SBOM — release artifact'ları için bağımlılık envanteri.
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    needs: [contracts, typescript, java]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs --output sbom.json

      - name: Verify SBOM has components
        run: |
          total=$(node -e "const s=require('./sbom.json');console.log(s.metadata.properties.find(p=>p.name==='sbom:total_components').value)")
          echo "SBOM total components: ${total}"
          if [ "${total}" -lt "50" ]; then
            echo "ERROR: SBOM has fewer than 50 components — parser may be broken"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # Doctor — sağlık kontrolü (M3).
  # -------------------------------------------------------------------------
  doctor:
    name: Doctor health check
    runs-on: ubuntu-latest
    needs: [contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          java_major="$(grep -A2 '^java:' compatibility/paper-26.2-build-84-v1.yaml | grep 'runtime_major:' | head -1 | sed 's/.*runtime_major: *\([0-9]*\).*/\1/')"
          echo "java=${java_major}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      # Doctor'ın java check'i pinned major'ı doğrular; runner'da Java yoksa
      # check fail eder ve --json exit 1 döner — setup-java zorunlu.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen
      - run: pnpm run build

      - name: Run mcpdev doctor
        run: node apps/cli/dist/src/index.js doctor --json

  # -------------------------------------------------------------------------
  # Security regression — M3 kapı testi.
  # Tüm güvenlik testlerini çalıştırır: process, container, injection,
  # recovery, backend-downgrade, lifecycle-stress, three-project.
  # -------------------------------------------------------------------------
  security:
    name: Security regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [contracts, typescript]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen

      - name: Build TypeScript
        run: pnpm run build

      - name: Run security tests
        working-directory: apps/run-supervisor
        run: |
          node --test dist/test/process-security.test.js \
                dist/test/container-security.test.js \
                dist/test/injection-security.test.js \
                dist/test/recovery-security.test.js \
                dist/test/backend-security.test.js \
                dist/test/lifecycle-stress.test.js \
                dist/test/three-project-validation.test.js \
                dist/test/malicious-fixtures.test.js

  # -------------------------------------------------------------------------
  # Checksum — release artifact checksum'ları (V1 gate).
  # -------------------------------------------------------------------------
  checksum:
    name: Release checksums
    runs-on: ubuntu-latest
    needs: [contracts, typescript, java, sbom]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen

      - name: Build TypeScript
        run: pnpm run build

      - name: Generate checksums
        run: node scripts/generate-checksums.mjs --output checksums.sha256

      - name: Verify checksums exist
        run: |
          if [ ! -s checksums.sha256 ]; then
            echo "ERROR: checksums.sha256 is empty"
            exit 1
          fi
          total=$(grep -c "^[a-f0-9]\{64\}" checksums.sha256 || true)
          echo "Total checksums: ${total}"
          if [ "${total}" -lt "2" ]; then
            echo "ERROR: Expected at least 2 checksums"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.sha256
          retention-days: 90

  # -------------------------------------------------------------------------
  # Aşağıdaki işler M0 ve M1'de eklenecek. Şimdi eklenmemelerinin nedeni
  # DOC-GATE-02'dir: her zaman yeşil geçen boş bir iş, geçmeyen bir kapıdır.
  #
  #   mcp-inspector     : Inspector smoke (M0)
  #   paper-smoke       : Gerçek Paper 5 lifecycle (M0)
  #   e2e-minimal       : project_inspect -> ... -> runtime_release (M1)
  #   dependency-scan   : bağımlılık zafiyet taraması (M1)
  # -------------------------------------------------------------------------
