name: PR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Sözleşme kapıları — kod derlenmeden önce çalışır. Registry veya doküman
  # bozuksa TypeScript/Java işlerini çalıştırmanın anlamı yok.
  # -------------------------------------------------------------------------
  contracts:
    name: Contracts and documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version from compatibility profile
        id: profile
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          echo "Pinned Node: ${node_version}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # DOC-GATE-03 — JSON/YAML parse (markdown içindeki bloklar dahil)
      - name: DOC-GATE-03 parse
        run: pnpm run check:parse

      # DOC-GATE-04 — registry bütünlüğü, duplicate, risk türetimi, ADR-0007
      - name: DOC-GATE-04 registry
        run: pnpm run check:registry

      # Şema derlenebilirliği ve kayıtların şemaya uygunluğu
      - name: Schema validation
        run: pnpm run check:schemas

      # DOC-GATE-01/02/03/05/06 — boyut, belirsizlik, link, izlenebilirlik,
      # güvenlik dürüstlüğü
      - name: Documentation gates
        run: pnpm run check:docs

      # Generated dosyalar elle düzenlenmiş mi?
      - name: Contract generation drift
        run: pnpm run gen:check

  typescript:
    name: TypeScript
    runs-on: ${{ matrix.os }}
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # P0-4: Windows GitHub runner'da Docker CLI bulunur ama Linux container
      # daemon güvenilir değil (exit 125). Canlı Docker testleri zorla skip edilir;
      # hermetic (argüman üretim) testler yine koşar. Ubuntu'da gerçek daemon.
      MCPDEV_SKIP_DOCKER: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated tipler olmadan typecheck geçemez
      - run: pnpm run gen

      - run: pnpm run typecheck

      - run: pnpm run test

  java:
    name: Paper Bridge
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Java and Node versions
        id: profile
        run: |
          java_major="$(grep -A2 '^java:' compatibility/paper-26.2-build-84-v1.yaml | grep 'runtime_major:' | head -1 | sed 's/.*runtime_major: *\([0-9]*\).*/\1/')"
          echo "java=${java_major}" >> "$GITHUB_OUTPUT"
          echo "Pinned Java: ${java_major}"
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          echo "Pinned Node: ${node_version}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen

      # Wrapper doğrulaması — kendi ürünümüzün supply-chain kuralı kendimize de
      # uygulanır (docs/security/supply-chain.md).
      - uses: gradle/actions/wrapper-validation@v4

      # DİKKAT: Gradle cache'i BİLİNÇLİ olarak önbelleğe alınmaz.
      #
      # Runner her koşuda boş bir cache ile başlar. Bu, sıcak cache ile üretilmiş
      # eksik verification-metadata.xml'i yakalayan TEK güvenilir korumadır;
      # ölçüldü ve bir kez gerçekten yakalandı (supply-chain.md).
      # Cache eklemek build'i hızlandırır fakat bu hata sınıfını görünmez kılar.
      - name: Build bridge (soğuk cache — kasıtlı)
        working-directory: bridge/paper
        run: ./gradlew --no-daemon build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # SBOM — release artifact'ları için bağımlılık envanteri.
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    needs: [contracts, typescript, java]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate SBOM
        run: node scripts/generate-sbom.mjs --output sbom.json

      - name: Verify SBOM has components
        run: |
          total=$(node -e "const s=require('./sbom.json');console.log(s.metadata.properties.find(p=>p.name==='sbom:total_components').value)")
          echo "SBOM total components: ${total}"
          if [ "${total}" -lt "50" ]; then
            echo "ERROR: SBOM has fewer than 50 components — parser may be broken"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # -------------------------------------------------------------------------
  # dependency-scan — bağımlılık zafiyet taraması (M3, OSV).
  #
  # pnpm-lock.yaml + gradle.lockfile purl'larını OSV querybatch'e sorar;
  # eşiğin (varsayılan high) üstündeki bulgular allowlist'te değilse job
  # kırmızıdır. Allowlist: security/dependency-scan.allowlist.yaml (gerekçeli,
  # sessizce büyüyemez — yeni bulgu girilmemişse gate kırılır).
  #
  # Köşe taşları:
  #  * Severity kaynağı OSV `database_specific.severity` (GitHub), yoksa CVSS v3.
  #  * Ağ erişimi gerekir (api.osv.dev) — canlı veri, önbellek yok.
  #  * build gerektirmez; yalnızca pnpm install (yaml parser).
  # -------------------------------------------------------------------------
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: [contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run dependency scan
        run: node scripts/dependency-scan.mjs --quiet

  # -------------------------------------------------------------------------
  # Doctor — sağlık kontrolü (M3).
  # -------------------------------------------------------------------------
  doctor:
    name: Doctor health check
    runs-on: ubuntu-latest
    needs: [contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          java_major="$(grep -A2 '^java:' compatibility/paper-26.2-build-84-v1.yaml | grep 'runtime_major:' | head -1 | sed 's/.*runtime_major: *\([0-9]*\).*/\1/')"
          echo "java=${java_major}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      # Doctor'ın java check'i pinned major'ı doğrular; runner'da Java yoksa
      # check fail eder ve --json exit 1 döner — setup-java zorunlu.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen
      - run: pnpm run build

      - name: Run mcpdev doctor
        run: node apps/cli/dist/src/index.js doctor --json

  # -------------------------------------------------------------------------
  # Security regression — M3 kapı testi.
  # Tüm güvenlik testlerini çalıştırır: process, container, injection,
  # recovery, backend-downgrade, lifecycle-stress, three-project.
  # -------------------------------------------------------------------------
  security:
    name: Security regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [contracts, typescript]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # P0-4: Windows GitHub runner'da canlı Docker güvenilir değil — bu env
      # container-security.test.ts içindeki canlı Docker testlerini skip eder.
      MCPDEV_SKIP_DOCKER: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen

      - name: Build TypeScript
        run: pnpm run build

      # DİKKAT: tek satır — GitHub Actions Windows runner'ında default shell
      # PowerShell'dir; `\` satır devamı bash'e özgüdür, pwsh'te `\` node'a
      # ayrı argüman olarak gidip "Cannot find module 'D:\'" hatası üretir.
      - name: Run security tests
        working-directory: apps/run-supervisor
        run: node --test dist/test/process-security.test.js dist/test/container-security.test.js dist/test/injection-security.test.js dist/test/recovery-security.test.js dist/test/backend-security.test.js dist/test/lifecycle-stress.test.js dist/test/three-project-validation.test.js dist/test/malicious-fixtures.test.js

  # -------------------------------------------------------------------------
  # Checksum — release artifact checksum'ları (V1 gate).
  # -------------------------------------------------------------------------
  checksum:
    name: Release checksums
    runs-on: ubuntu-latest
    needs: [contracts, typescript, java, sbom]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: profile
        shell: bash
        run: |
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen

      - name: Build TypeScript
        run: pnpm run build

      - name: Generate checksums
        run: node scripts/generate-checksums.mjs --output checksums.sha256

      - name: Verify checksums exist
        run: |
          if [ ! -s checksums.sha256 ]; then
            echo "ERROR: checksums.sha256 is empty"
            exit 1
          fi
          total=$(grep -c "^[a-f0-9]\{64\}" checksums.sha256 || true)
          echo "Total checksums: ${total}"
          if [ "${total}" -lt "2" ]; then
            echo "ERROR: Expected at least 2 checksums"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.sha256
          retention-days: 90

  # -------------------------------------------------------------------------
  # e2e-minimal — M3 release-hardening kapısı (status/project-status.yaml).
  #
  # Gerçek uçtan uca dikey dilim: mcpdev serve üzerinden official MCP Client
  # ile project_inspect → plugin_build (gerçek Gradle, offline) →
  # scenario_run (plugin-enables, gerçek Paper) → evidence_get →
  # plugin_launch (Reader Paper READY) → plugin_stop (graceful).
  #
  # Köşe taşları:
  #  * EULA kabulü yalnızca operator yüzeyinden (driver içinde `eula accept`).
  #  * Agent network:online provisioning onayı ister (separation of authority);
  #    bu yüzden build offline, doğrulanmış bağımlılık cache üzerinden koşar.
  #  * Java 25 zorunlu (Paper 26.2 toolchain; yoksa JAVA_VERSION_MISMATCH).
  # -------------------------------------------------------------------------
  e2e-minimal:
    name: E2E minimal chain
    runs-on: ubuntu-latest
    needs: [contracts, typescript, java]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Java and Node versions
        id: profile
        run: |
          java_major="$(grep -A2 '^java:' compatibility/paper-26.2-build-84-v1.yaml | grep 'runtime_major:' | head -1 | sed 's/.*runtime_major: *\([0-9]*\).*/\1/')"
          echo "java=${java_major}" >> "$GITHUB_OUTPUT"
          echo "Pinned Java: ${java_major}"
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          echo "Pinned Node: ${node_version}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen
      - run: pnpm run build

      # Bridge plugin JAR — e2e için gerekiyor. Trusted-local + offline build
      # deseni java job ile aynı; gradle cache bilinçli önbelleğe alınmaz.
      - name: Build bridge (soğuk cache)
        working-directory: bridge/paper
        run: ./gradlew --no-daemon build

      # Provisioning: doğrulanmış bağımlılık cache'ini ~/.gradle'a doldurur
      # (gradle dist + wrapper + modules-2). Driver bu cache'ten seed alır.
      # Bu adım operator yüzeyinin CI karşılığıdır (agent online değildir).
      - name: Provision Gradle dependency cache
        working-directory: fixtures/projects/minimal-paper-plugin
        run: ./gradlew --no-daemon dependencies

      - name: Run e2e-minimal driver
        run: node apps/mcp-server/e2e/minimal.driver.mjs

  # -------------------------------------------------------------------------
  # paper-smoke — M3 release-hardening kapısı (status/project-status.yaml).
  #
  # Gerçek Paper 5 lifecycle (m0-smoke'un deterministik CI karşılığı):
  # Paper JAR indir → runtime image → Paper boot → READY gate (handshake +
  # health + PaperBridge enabled) → salt-okuma gözlemleri (plugin/world/event)
  # → negatif kanıtlar (yanlış token → 401, mutation reddi) → graceful cleanup.
  #
  # e2e-minimal ile örtüşen kısımlar bilinçlidir: orada MCP Client zinciri
  # (inspect→build→scenario→launch) kanıtlanır; burada M0'ın salt-okuma +
  # mutation-arizi iddiası doğrulanır. Gradle cache provisioning GEREKMEZ —
  # driver build yapmaz, doğrudan gerçek Paper başlatır.
  #
  # Köşe taşları:
  #  * EULA kabulü yalnızca operator yüzeyinden (driver içinde `eula accept`).
  #  * Java 25 zorunlu (Paper 26.2 toolchain).
  #  * ~60 MB Paper JAR PaperMC Downloads Service'ten indirilir (ağ erişimi).
  # -------------------------------------------------------------------------
  paper-smoke:
    name: Paper smoke (M0)
    runs-on: ubuntu-latest
    needs: [contracts, typescript, java]
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Java and Node versions
        id: profile
        run: |
          java_major="$(grep -A2 '^java:' compatibility/paper-26.2-build-84-v1.yaml | grep 'runtime_major:' | head -1 | sed 's/.*runtime_major: *\([0-9]*\).*/\1/')"
          echo "java=${java_major}" >> "$GITHUB_OUTPUT"
          echo "Pinned Java: ${java_major}"
          node_version="$(grep -A2 '^node:' compatibility/paper-26.2-build-84-v1.yaml | grep 'version:' | head -1 | sed 's/.*version: *"\?\([^"]*\)"\?.*/\1/')"
          echo "node=${node_version}" >> "$GITHUB_OUTPUT"
          echo "Pinned Node: ${node_version}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen
      - run: pnpm run build

      # Bridge plugin JAR + supervisor dist (driver, m0-smoke.js'i dist'ten
      # import eder). Soğuk cache deseni java/e2e-minimal ile aynı.
      - name: Build bridge (soğuk cache)
        working-directory: bridge/paper
        run: ./gradlew --no-daemon build

      - name: Run paper-smoke driver
        run: node apps/run-supervisor/e2e/paper-smoke.driver.mjs

  # -------------------------------------------------------------------------
  # M3 release-hardening CI gates (status/project-status.yaml).
  #
  #   paper-smoke       : GERÇEKLEŞTİ (yukarıdaki paper-smoke job'ı, driver: apps/run-supervisor/e2e/paper-smoke.driver.mjs)
  #   dependency-scan   : GERÇEKLEŞTİ (yukarıdaki dependency-scan job'ı, driver: scripts/dependency-scan.mjs — OSV)
  # -------------------------------------------------------------------------
