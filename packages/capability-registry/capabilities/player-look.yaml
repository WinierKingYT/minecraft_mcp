id: player.look
version: 1
milestone: M2B
summary: Test actor'ın bakış yönünü (yaw/pitch) değiştirir.
status: conditional

exposure:
  developer_tool: null
  debug_tool: null
  bridge_operation: player.look
  dsl_step: player.look

risk:
  effect: mutation
  scope: disposable_runtime
  reversibility: runtime_discard
  approval: profile
  exposure: agent_visible
  cost: low
  level: R2

contracts:
  input: schemas/player-look.input.json
  output: schemas/player-look.output.json

limits:
  timeout_ms: 10000
  requires_idempotency: true

requires:
  runtime_state: [READY]
  capabilities:
    - test_actor.protocol

errors:
  - CAPABILITY_UNAVAILABLE
  - ACTOR_UNAVAILABLE
  - PLAYER_NOT_FOUND
  - IDEMPOTENCY_KEY_ARGUMENT_MISMATCH
  - MUTATION_UNKNOWN_OUTCOME

tests:
  contract: [CT-ACTOR-LOOK-001]
  integration: [IT-ACTOR-LOOK-001]
  security: [ST-PROC-001]

notes: >
  Yön değişikliği gerçek oyuncu bağlantısı üzerinden işlenir; events/player.look
  olarak gözlemlenebilir. Yalnızca test runtime'a bağlı actor'lar için
  geçerlidir (ADR-0006).

