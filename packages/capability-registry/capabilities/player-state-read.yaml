requires:
  runtime_state: [READY]

errors:
  - RUNTIME_NOT_RUNNING
  - PLAYER_NOT_FOUND
  - BRIDGE_TIMEOUT
  - CAPABILITY_UNAVAILABLE

tests:
  contract: [CT-PLAYER-STATE-001]
  integration: [IT-PLAYER-STATE-001]
  security: [ST-REDACT-003]

notes: >
  Yanıt IP adresi veya gerçek hesap kimliği içermez; yalnızca test actor
  kimliği döner.
