id: events.read
version: 1
milestone: M0
summary: Boot'a bağlı cursor ile seçilmiş Paper event'lerini sıralı biçimde okur.
status: planned

exposure:
  developer_tool: null
  debug_tool: minecraft_events_query
  bridge_operation: events.query
  dsl_step: assert.event

risk:
  effect: read
  scope: disposable_runtime
  reversibility: reversible
  approval: none
  exposure: agent_visible
  cost: low
  level: R0

contracts:
  input: schemas/events-query.input.json
  output: schemas/events-query.output.json

limits:
  timeout_ms: 5000
  max_results: 1000

requires:
  runtime_state: [READY]

errors:
  - RUNTIME_NOT_RUNNING
  - EVENT_CURSOR_INSTANCE_MISMATCH
  - EVENT_CURSOR_EXPIRED
  - EVENT_BUFFER_OVERFLOW
  - BRIDGE_TIMEOUT
  - CAPABILITY_UNAVAILABLE

tests:
  unit: [UT-EVENT-CURSOR-001]
  contract: [CT-EVENTS-QUERY-001, CT-BRIDGE-004]
  integration: [IT-EVENTS-001]
  security: [ST-REDACT-003, ST-INJECT-001]

notes: >
  Chat event'leri varsayılan olarak kapalıdır; IP ve kişisel veri hiç
  kaydedilmez (contracts/events-and-mutations.md EV-04, EV-05).
