id: paper-26.2-build-84-v1
status: active
created_at: 2026-07-29

# --------------------------------------------------------------------------
# VERIFICATION — D0A çıkış koşulu
#
#   pnpm run verify:compatibility
#
# DOC-GATE-02 gereği burada `latest` / `current` / `stable` gibi hareketli
# sürüm ifadesi kullanılamaz.
# --------------------------------------------------------------------------
verification:
  status: verified
  verified_at: 2026-08-02
  reason: >
    Tüm alanlar doğrulandı: Java 25.0.4 (Temurin), Node v24.18.1,
    pnpm 10.15.0, TypeScript 5.9.3. Tüm uzak koordinatlar resmî
    kaynaklardan doğrulandı, checksum'lar dolduruldu ve bridge/paper
    Java 25 toolchain'i ile BAŞARIYLA DERLENDİ.
  blocking_gates: []
  verified_fields:
    - minecraft.version
    - paper.build
    - paper.channel
    - paper.api_coordinate
    - paper.jar_sha256
    - node.version
    - gradle.wrapper_version
    - gradle.distribution_sha256
    - mcp.protocol_version
    - mcp.sdk.server
    - mcp.sdk.node
    - npm_toolchain
    - java.runtime_major
    - java.toolchain_major
    - gradle.wrapper_jar_sha256
    - node.installed_version_matches_pin
    - maven.wrapper_version
    - maven.distribution_sha256
    - maven.wrapper_jar_sha256
  pending_fields: []

minecraft:
  version: "26.2"

paper:
  channel: STABLE
  build: 84
  # DOĞRULANDI: Paper, MC 26.x hattında `<mc>.build.<n>-<stage>` biçimine
  # geçmiştir. Tarihsel `<mc>-R0.1-SNAPSHOT` biçimi yalnızca 1.x hattında
  # kullanılmaya devam ediyor. Kaynak: repo.papermc.io maven-metadata.xml
  api_coordinate: "io.papermc.paper:paper-api:26.2.build.84-stable"
  api_version: "26.2"
  download_source: "PaperMC Downloads Service v3 (https://fill.papermc.io)"
  checksum_policy: "download manifest SHA-256 must be stored and verified"
  jar_sha256: "defe82c1c89067186895de34cf32983e9f5a2ea387cfe7597c020faebb98ca16"
  jar_filename: "paper-26.2-84.jar"
  # Sabit metin URL güvenilmez; her indirmede Downloads Service yanıtından
  # yeniden çözülür. Aşağıdaki değer yalnızca doğrulama kaydıdır.
  observed_download_url: "https://fill-data.papermc.io/v1/objects/defe82c1c89067186895de34cf32983e9f5a2ea387cfe7597c020faebb98ca16/paper-26.2-84.jar"
  hardcoded_download_url_allowed: false
  # Downloads Service jenerik User-Agent reddeder; yazılımı tanımlayan ve
  # iletişim adresi içeren bir UA zorunludur.
  user_agent_required: true
  # 2026-07-30 itibarıyla 26.2 hattındaki en yeni STABLE build. Profil
  # bilinçli olarak 84'e pinlidir; yükseltme ADR gerektirir.
  observed_newest_build: 87

# DOĞRULANDI: Temurin 25.0.4.7 kuruldu; Gradle toolchain çözüldü ve
# bridge/paper derlendi.
java:
  runtime_major: 25
  toolchain_major: 25
  verified_distribution: "Eclipse Temurin 25.0.4.7-hotspot"

# ADR-0009: pin, aynı LTS minor hattındaki güvenlik sürümüne taşındı.
# Aynı minor hattındaki sonraki güvenlik yamaları için yeni ADR gerekmez.
node:
  version: "24.18.1"
  release_line: "LTS"
  lts_codename: "Krypton"
  security_release: true

gradle:
  wrapper_version: "9.6.1"
  wrapper_jar_verification: required
  # Wrapper, checksum'ı doğrulanmış dağıtımdan üretildi.
  # Kayıt: bridge/paper/gradle/wrapper/WRAPPER-CHECKSUMS.md
  wrapper_jar_sha256: "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"
  distribution_sha256: "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"
  distribution_url: "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip"
  distribution_url_allowlist:
    - "services.gradle.org"
  dependency_locking: required
  dependency_verification: required
  verification_mode: strict

# Maven Wrapper — build kanalı (docs/security/supply-chain.md).
# 3.9.16, resmî yayın dağıtımından yedek değil: bin.zip SHA-256 5af3b74...
# ile archive.apache.org dist listesinden; maven-wrapper-3.3.2.jar ise
# repo.maven.apache.org maven2 koordinatından doğrulandı (ST-MAVEN-001..006).
maven:
  wrapper_version: "3.9.16"
  wrapper_jar_verification: required
  # Wrapper JAR build'den önce çalışan kod; maven-wrapper 3.3.2 yayını.
  wrapper_jar_sha256: "3d8f20ce6103913be8b52aef6d994e0c54705fb527324ceb9b835b338739c7a8"
  # DOĞRULANDI: apache-maven-3.9.16-bin.zip SHA-256
  distribution_sha256: "5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce"
  distribution_url: "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip"
  distribution_url_allowlist:
    - "repo.maven.apache.org"
    - "dlcdn.apache.org"

mcp:
  # DOĞRULANDI: 2026-07-28 revizyonu 28 Temmuz 2026'da FINAL olarak
  # yayınlandı. Release candidate DEĞİLDİR.
  protocol_version: "2026-07-28"
  protocol_status: final
  transport: "stdio"
  tasks_extension: disabled
  remote_transport: disabled

  # Bu revizyonun ürünü doğrudan etkileyen kırıcı değişiklikleri:
  breaking_changes:
    stateless_core: true
    initialize_handshake_removed: true
    session_id_header_removed: true
    server_discover_optional_rpc: true
    list_results_cacheable: true      # ttlMs + cacheScope
    multi_round_trip_requests: true   # resultType: "input_required"
    legacy_http_sse_deprecated: true

  # DOĞRULANDI: stable 2.0.0 yayınlandı (2026-07-27). Protokol kabuğu
  # official server SDK'ya taşındı (ADR-0010); conformance official client
  # ile koşulur.
  sdk:
    server: "@modelcontextprotocol/server@2.0.0"
    node: "@modelcontextprotocol/node@2.0.0"
    client: "@modelcontextprotocol/client@2.0.0"
    channel: stable
    # ADR-0010: protokol yüzeyi SDK üzerine implement edildi; custom transport
    # silindi. Conformance: 56/57 pass (skip: canlı supervisor E2E, P0-7 sonrası).
    linked: true
    linked_at: 2026-08-11
  release_policy: >
    Stable 2.x SDK, protokol yüzeyinin taşıyıcısıdır (ADR-0010). V1 release
    gate'i artık conformance'ın canlı supervisor E2E ayağına (mcpdev serve,
    P0-7) bağlıdır.

# DOĞRULANDI: tüm pinler pnpm install ile çözüldü ve lockfile üretildi.
npm_toolchain:
  package_manager: "pnpm@10.15.0"
  typescript: "5.9.3"
  ajv: "8.17.1"
  ajv_formats: "3.0.1"
  yaml: "2.8.1"
  types_node: "24.7.0"
  lockfile_committed: true

protocols:
  bridge: 1
  scenario_dsl: 1
  config_schema: 1
  plugin_test_contract: 1
  capability_registry: 1

plugin_metadata_support:
  plugin.yml:
    status: supported
    default: true
  paper-plugin.yml:
    status: experimental
    default: false
    enable_with_feature_flag: true
  both_present:
    status: supported
    precedence: explicit_manifest_policy

rules:
  - "Moving version expressions (latest/current/stable) MUST NOT appear in artifact manifests."
  - "Paper download URL MUST be resolved from the official Downloads Service response."
  - "Downloads Service requests MUST send a specific User-Agent with a contact address."
  - "Downloaded Paper JAR SHA-256 MUST match paper.jar_sha256 on every runtime creation."
  - "Paper build, Paper API coordinate and plugin.yml api-version MUST be mutually consistent."
  - "No runtime is started on a Java major other than java.runtime_major."
  - "No release build is produced on a Node version other than node.version."
  - "Prototype MAY run on another Gradle wrapper version; the release profile MUST NOT."
  - "The MCP protocol surface MUST be served by the pinned server SDK (ADR-0010); custom transports are not allowed on the release profile."
  - "Moving to a newer SDK requires an ADR revision and a full conformance test run."
